services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skylink
      POSTGRES_USER: skylink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skylink-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skylink -d skylink"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://skylink:${POSTGRES_PASSWORD:-skylink-local-only}@db:5432/skylink
      SECRET_KEY: ${SECRET_KEY:-local-development-key-change-before-deployment}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://192.168.31.141:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
